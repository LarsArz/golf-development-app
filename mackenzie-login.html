<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mackenzie Setup · The Swing Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#aeb2b7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111}.shell{max-width:560px;margin:auto;min-height:100dvh;background:#eee}.head{background:linear-gradient(135deg,#111,#333);color:#fff;padding:calc(env(safe-area-inset-top) + 25px) 22px 30px;border-radius:0 0 28px 28px}.head a{color:white;text-decoration:none}.head h1{font-size:30px;margin:28px 0 5px}.main{padding:24px 18px}.card{background:#fff;border-radius:24px;padding:24px 20px}label{display:block;font-weight:800;margin:18px 0 9px}input{width:100%;font-size:24px;letter-spacing:7px;text-align:center;padding:14px;border:1px solid #ccc;border-radius:14px}button{width:100%;padding:16px;margin-top:16px;background:#d62828;border:0;border-radius:14px;color:#fff;font-weight:850;font-size:17px}.muted{color:#666;font-size:14px;line-height:1.5}.hide{display:none}</style></head><body><div class="shell"><header class="head"><a href="./">← The Swing Lab</a><h1>Mackenzie's Device</h1><p>Hard work pays off.</p></header><main class="main"><div class="card"><div id="setup"><h2>Connect your phone</h2><p class="muted">Ask your parent to generate a one-time code from Parent Access. You only need to pair this browser once.</p><form id="form"><label for="code">Eight-digit pairing code</label><input id="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" required><button id="submit">Connect my phone</button></form></div><div id="ready" class="hide"><h2>✓ You're connected!</h2><p class="muted">Your device is paired. Shared practice features will be added next.</p><a href="./">Go to The Swing Lab</a></div><p id="status" role="status" aria-live="polite"></p></div></main></div><script>const API='https://swing-lab-api.larry-artzner.workers.dev',KEY='swingLabGolferSessionV1';const setup=document.getElementById('setup'),ready=document.getElementById('ready'),status=document.getElementById('status');function show(ok){setup.classList.toggle('hide',ok);ready.classList.toggle('hide',!ok)}async function check(){const token=localStorage.getItem(KEY);if(!token)return;try{const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(r.ok&&d.role==='golfer')show(true);else localStorage.removeItem(KEY)}catch{status.textContent='Unable to check connection right now.'}}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),code=document.getElementById('code');btn.disabled=true;status.textContent='Connecting…';try{const r=await fetch(API+'/auth/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:code.value})});const d=await r.json();code.value='';if(!r.ok){status.textContent=d.error||'Could not connect';return}localStorage.setItem(KEY,d.token);show(true);status.textContent='Connected successfully.'}catch{status.textContent='Connection failed. Try again.'}finally{btn.disabled=false}});check();</script></body></html>
